name: sync-google-jwks

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Google JWKS
        run: |
          curl -fsS --retry 3 https://www.googleapis.com/oauth2/v3/certs -o jwks.new.json
          python3 - <<'PY'
          import json
          d = json.load(open("jwks.new.json"))
          keys = d.get("keys") or []
          assert keys, "empty JWKS"
          for k in keys:
              assert k.get("kid") and k.get("n") and k.get("e") and k.get("kty") == "RSA", k
          PY
          mv jwks.new.json jwks.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- jwks.json; then
            echo "unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jwks.json
          git commit -m "Update JWKS"
          git push
